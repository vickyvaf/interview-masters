name: interview-masters

services:
  # 1. Python Supertonic 3 ONNX TTS Microservice (Port 7788)
  supertonic:
    build:
      context: ./apps/supertonic
      dockerfile: Dockerfile
    container_name: interview-masters-supertonic
    ports:
      - "7788:7788"
    environment:
      - HOST=0.0.0.0
      - PORT=7788
    restart: unless-stopped

  # 2. Hono Node.js REST API Backend (Port 5005)
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: interview-masters-backend
    ports:
      - "5005:5005"
    env_file:
      - .env.local
    environment:
      - PORT=5005
      - NODE_ENV=production
    depends_on:
      - supertonic
    restart: unless-stopped

  # 3. Candidate Dashboard - React + Vite (Port 5173)
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://dcouzpirkktfxklgqqwv.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-sb_publishable_bKLxENwOmDwt1CQJLSz4Fg_YpiJaNdU}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5005}
        VITE_TTS_URL: ${VITE_TTS_URL:-http://localhost:7788}
    container_name: interview-masters-dashboard
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    depends_on:
      - backend
      - supertonic
    restart: unless-stopped

  # 4. Astro Landing Page (Port 4321)
  landing-page:
    build:
      context: .
      dockerfile: apps/landing-page/Dockerfile
      args:
        PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:5173}
        PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-https://dcouzpirkktfxklgqqwv.supabase.co}
        PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_bKLxENwOmDwt1CQJLSz4Fg_YpiJaNdU}
    container_name: interview-masters-landing
    ports:
      - "4321:4321"
    env_file:
      - .env.local
    restart: unless-stopped
